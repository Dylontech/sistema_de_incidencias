<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Soporte técnico — Sistema de Incidencias</title>
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/extensiones.css">
</head>
<body class="pagina-publica">
<main class="login-card publico-card soporte-card">
  <header class="soporte-head">
    <div>
      <h1><i class="bi bi-life-preserver"></i> Soporte técnico</h1>
      <p class="sub">Bandeja de tickets: asignación, respuestas y notas internas.</p>
    </div>
    <a class="btn btn-outline btn-sm" href="/">
      <i class="bi bi-arrow-left"></i> Volver
    </a>
  </header>

  <div id="soporteAviso" class="publico-msg info"></div>

  <div class="soporte-filtros" id="soporteFiltros" hidden>
    <div class="form-group">
      <label for="soporteEstado">Estado</label>
      <select id="soporteEstado">
        <option value="">Todos</option>
        <option value="abierto">Abiertos</option>
        <option value="en_revision">En revisión</option>
        <option value="respondido">Respondidos</option>
        <option value="cerrado">Cerrados</option>
      </select>
    </div>
    <div class="form-group">
      <label for="soportePrioridad">Prioridad</label>
      <select id="soportePrioridad">
        <option value="">Todas</option>
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
    </div>
    <div class="form-group">
      <label for="soporteAsignacion">Asignación</label>
      <select id="soporteAsignacion">
        <option value="">Todos</option>
        <option value="sin">Sin asignar</option>
        <option value="mios">Asignados a mí</option>
      </select>
    </div>
    <div class="form-group">
      <label for="soporteBuscar">Buscar</label>
      <input type="text" id="soporteBuscar" placeholder="Folio o asunto…">
    </div>
    <button type="button" class="btn btn-primary" id="soporteRecargar">
      <i class="bi bi-arrow-clockwise"></i> Actualizar
    </button>
  </div>

  <div class="soporte-layout" id="soporteLayout" hidden>
    <section class="soporte-lista" id="soporteLista" aria-label="Tickets"></section>
    <section class="soporte-detalle" id="soporteDetalle" aria-live="polite"></section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script type="module" src="js/soporte.js"></script>
</body>
</html>
