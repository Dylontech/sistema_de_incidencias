<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Página interna del personal: no se enlaza desde la aplicación ni se anuncia
     a los buscadores, así que solo entra quien conoce la dirección. -->
<meta name="robots" content="noindex, nofollow">
<title>Acceso del personal — Sistema de Incidencias</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/componentes.css">
<link rel="stylesheet" href="css/extensiones.css">
</head>
<body>

<!-- ============================================================
     ACCESO DEL PERSONAL (funcionario y administrador)
     La pantalla de acceso de la aplicación solo ofrece el acceso ciudadano;
     esta página es la otra puerta, sin enlaces en la interfaz.
     ============================================================ -->
<div class="login-screen">
  <div class="login-card">
    <h1><i class="bi bi-shield-lock-fill"></i> Acceso del personal</h1>
    <p class="sub">Funcionario y administrador del municipio</p>

    <div class="login-tabs">
      <button class="login-tab active" type="button" data-panel="func">Funcionario</button>
      <button class="login-tab" type="button" data-panel="admin">Administrador</button>
    </div>

    <!-- FUNCIONARIO -->
    <div class="login-panel active" id="panel-func">
      <form id="formFunc">
        <div class="form-group">
          <label for="func-user">Usuario</label>
          <input type="text" id="func-user" name="username" placeholder="ej. jlopez" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="func-pass">Contraseña</label>
          <input type="password" id="func-pass" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="func-code">Clave de municipio</label>
          <input type="text" id="func-code" name="claveMunicipio" placeholder="Ej. 16050 (clave geoestadística)" style="text-transform:uppercase;">
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <i class="bi bi-shield-lock-fill"></i> Iniciar sesión
        </button>
      </form>
    </div>

    <!-- ADMINISTRADOR -->
    <div class="login-panel" id="panel-admin">
      <form id="formAdmin">
        <div class="form-group">
          <label for="admin-user">Usuario</label>
          <input type="text" id="admin-user" name="username" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="admin-pass">Contraseña</label>
          <input type="password" id="admin-pass" name="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit">
          <i class="bi bi-shield-fill-check"></i> Iniciar sesión
        </button>
      </form>
    </div>

    <p class="personal-nota">
      <i class="bi bi-info-circle"></i> La sesión queda abierta en este dispositivo:
      <a href="/">vuelve a la aplicación</a> para usarla.
    </p>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loading">
  <div style="text-align:center;">
    <div class="spinner"></div>
    <div id="loadingText">Procesando…</div>
  </div>
</div>

<script type="module" src="js/personal.js"></script>
</body>
</html>
